# LinguaBloom — Docker Compose
#
#   docker compose up -d --build     # build and start app + database
#   docker compose pull app && docker compose up -d
#                                    # or: use the prebuilt image (APP_IMAGE in .env)
#   docker compose ps                # health status
#   docker compose logs -f app       # application logs
#
# All settings come from .env (see .env.example). Data lives in named volumes:
#   pgdata  → PostgreSQL       appdata → uploads, audio, cache (/app/data)
# Back up BOTH (scripts/backup.sh does this).

name: linguabloom

services:
  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
      TZ: UTC
      PGTZ: UTC
    # Bound to 127.0.0.1: reachable from this machine (backups, local dev),
    # never from the network. The app reaches it as `db` on the compose network.
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    volumes:
      # PostgreSQL 18 images keep data under /var/lib/postgresql/<major>/docker.
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  app:
    # Unset: built locally from this checkout. Set APP_IMAGE (e.g. ghcr.io/<owner>/linguabloom:latest)
    # to run the image built by GitHub Actions instead: `docker compose pull app`.
    image: ${APP_IMAGE:-linguabloom-app}
    build:
      context: .
    restart: unless-stopped
    # Proper signal handling / zombie reaping for `node server.js`.
    init: true
    depends_on:
      db:
        condition: service_healthy
    # APP_PORT may include a bind address, e.g. 127.0.0.1:3000 behind a reverse proxy.
    ports:
      - "${APP_PORT:-3000}:3000"
    environment:
      APP_URL: ${APP_URL:?set APP_URL in .env}
      APP_SECRET: ${APP_SECRET:?set APP_SECRET in .env}
      # Password must be URL-safe (letters, digits, - and _), see .env.example.
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      OWNER_SETUP_ENABLED: ${OWNER_SETUP_ENABLED:-true}
      OWNER_SETUP_TOKEN: ${OWNER_SETUP_TOKEN:-}
      DEFAULT_LOCALE: ${DEFAULT_LOCALE:-zh-CN}
      DEFAULT_TIMEZONE: ${DEFAULT_TIMEZONE:-Asia/Shanghai}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      AI_ENABLED: ${AI_ENABLED:-false}
      AI_PROVIDER: ${AI_PROVIDER:-openai}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_BASE_URL: ${AI_BASE_URL:-}
      AI_TEXT_MODEL: ${AI_TEXT_MODEL:-}
      AI_REALTIME_MODEL: ${AI_REALTIME_MODEL:-}
      AI_TRANSCRIPTION_MODEL: ${AI_TRANSCRIPTION_MODEL:-}
      AI_TTS_MODEL: ${AI_TTS_MODEL:-}
      AI_VOICE: ${AI_VOICE:-alloy}
      AI_REALTIME_MAX_MINUTES: ${AI_REALTIME_MAX_MINUTES:-10}
      AI_TIMEOUT_MS: ${AI_TIMEOUT_MS:-30000}
      AI_MAX_OUTPUT_TOKENS: ${AI_MAX_OUTPUT_TOKENS:-900}
      AI_MONTHLY_BUDGET: ${AI_MONTHLY_BUDGET:-5}
      AI_TEXT_PRICE_INPUT_PER_1M: ${AI_TEXT_PRICE_INPUT_PER_1M:-}
      AI_TEXT_PRICE_OUTPUT_PER_1M: ${AI_TEXT_PRICE_OUTPUT_PER_1M:-}
      TZ: UTC
    volumes:
      - appdata:/app/data

volumes:
  pgdata:
  appdata:
